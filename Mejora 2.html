<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>📅 Control Semanal - Norlan García (Lunes a Sábado)</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #1e2a3a;
    padding: 10px;
    margin: 0;
    color: white;
    min-height: 100vh;
}
.container {
    background: white;
    color: black;
    padding: 15px;
    border-radius: 25px;
    max-width: 100%;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    margin-bottom: 20px;
}
h2, h3 {
    color: #1e3c72;
    margin: 5px 0 15px 0;
    text-align: center;
}
h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
.fecha-bar {
    background: #ffc107;
    padding: 8px 15px;
    border-radius: 40px;
    margin-bottom: 15px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
}
.fecha-bar button {
    padding: 8px 15px;
    border-radius: 30px;
    border: none;
    font-weight: bold;
    background: white;
    cursor: pointer;
    font-size: 0.9rem;
}
.dia-semana {
    background: #e9f0fc;
    padding: 12px;
    border-radius: 15px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.3s;
    border: 2px solid transparent;
}
.dia-semana:hover {
    background: #d4e4fc;
    transform: translateX(5px);
}
.dia-semana.activo {
    border-color: #ffc107;
    background: #fff3e0;
}
.dia-titulo {
    font-weight: bold;
    font-size: 1rem;
    color: #1e3c72;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}
.dia-stats {
    display: flex;
    gap: 15px;
    font-size: 0.75rem;
    color: #2c3e50;
}
.dia-stats span {
    background: white;
    padding: 3px 10px;
    border-radius: 20px;
}
.dia-contenido {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 2px solid #3498db;
}
.dia-contenido.activo {
    display: block;
}
.input-group {
    background: #e9f0fc;
    padding: 12px;
    border-radius: 20px;
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}
.input-group div {
    display: flex;
    flex-direction: column;
}
.input-group label {
    font-weight: bold;
    margin-bottom: 3px;
    font-size: 0.7rem;
    color: #2c3e50;
}
.input-group input, .input-group select {
    padding: 6px 4px;
    border-radius: 25px;
    border: 2px solid #3498db;
    text-align: center;
    font-weight: bold;
    font-size: 0.85rem;
    background: white;
    width: 100%;
}
.table-wrapper {
    overflow-x: auto;
    margin: 0 -5px;
    padding: 0 5px;
    border-radius: 15px;
    -webkit-overflow-scrolling: touch;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: #f8fafc;
    border-radius: 15px;
    min-width: 600px;
}
th {
    background: #2c3e50;
    color: white;
    padding: 8px 4px;
    font-size: 0.7rem;
}
td {
    padding: 6px 2px;
    border-bottom: 1px solid #ccc;
    text-align: center;
    font-size: 0.7rem;
}
td input[type=number] {
    width: 45px;
    padding: 5px 2px;
    text-align: center;
    font-size: 0.75rem;
    border: 2px solid #3498db;
    border-radius: 20px;
}
.total-row {
    background: #d9e2ec;
    font-weight: bold;
}
.verde {
    background: #d4edda;
    color: #155724;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 20px;
    display: inline-block;
    min-width: 40px;
}
.rojo {
    background: #f8d7da;
    color: #721c24;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 20px;
    display: inline-block;
    min-width: 40px;
}
.result-dia {
    background: #eef2f6;
    padding: 12px;
    border-radius: 15px;
    margin-top: 12px;
    font-size: 0.85rem;
    text-align: left;
}
.result-dia p {
    margin: 8px 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
}
.result-dia span {
    font-weight: bold;
    color: #1e3c72;
    background: #ffc107;
    padding: 4px 12px;
    border-radius: 30px;
    display: inline-block;
    font-size: 0.8rem;
}
.botones-accion {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 15px 0;
    flex-wrap: wrap;
}
.botones-accion button {
    padding: 10px 20px;
    font-size: 0.85rem;
    margin: 0;
    width: auto;
    max-width: none;
}
.resumen-semanal {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 15px;
    border-radius: 20px;
    margin-top: 15px;
}
.resumen-semanal table {
    background: rgba(255,255,255,0.9);
    color: black;
    min-width: 100%;
}
.resumen-semanal th {
    background: #2c3e50;
}
.resumen-semanal td {
    padding: 8px 5px;
}
.total-semanal {
    background: #ffc107;
    color: #1e3c72;
    padding: 12px;
    border-radius: 15px;
    text-align: center;
    margin-top: 12px;
    font-weight: bold;
    font-size: 1.1rem;
}
button {
    background: #ffc107;
    border: none;
    border-radius: 40px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    transition: transform 0.1s;
}
button:active {
    transform: scale(0.98);
}
</style>
</head>
<body>
<div class="container">
    <h2>📅 CONTROL SEMANAL</h2>
    <h3>NORLAN GARCÍA (Lunes a Sábado)</h3>

    <div class="fecha-bar">
        <span>📆 Semana del:</span>
        <input type="date" id="semanaInicio" value="">
        <button onclick="cargarSemana()">📂 Cargar Semana</button>
        <button onclick="guardarSemana()">💾 Guardar Semana</button>
        <button onclick="nuevaSemana()">🆕 Nueva Semana</button>
    </div>

    <div id="diasContainer"></div>

    <div class="botones-accion">
        <button onclick="exportarSemana()">📤 Exportar Semana</button>
        <button onclick="importarSemana()">📥 Importar Semana</button>
    </div>

    <div id="resumenSemanal" class="resumen-semanal"></div>
</div>

<script>
// Días de la semana (lunes a sábado)
const DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

// Obtener fecha de inicio de semana (lunes)
function obtenerInicioSemana(fecha) {
    let fechaObj = new Date(fecha);
    let dia = fechaObj.getDay();
    let diff = (dia === 0 ? 6 : dia - 1);
    fechaObj.setDate(fechaObj.getDate() - diff);
    return fechaObj;
}

function formatearFecha(fecha) {
    let año = fecha.getFullYear();
    let mes = String(fecha.getMonth() + 1).padStart(2, '0');
    let dia = String(fecha.getDate()).padStart(2, '0');
    return `${año}-${mes}-${dia}`;
}

function obtenerFechaActual() {
    let hoy = new Date();
    return formatearFecha(hoy);
}

function obtenerFechasSemana() {
    let inicioInput = document.getElementById('semanaInicio').value;
    let inicio;
    if (inicioInput) {
        inicio = new Date(inicioInput);
    } else {
        inicio = obtenerInicioSemana(new Date());
    }
    
    let fechas = [];
    for (let i = 0; i < 6; i++) {
        let fecha = new Date(inicio);
        fecha.setDate(inicio.getDate() + i);
        fechas.push(formatearFecha(fecha));
    }
    return fechas;
}

function obtenerDatosPorDefecto() {
    return {
        tareas: 283,
        desayuno: 0.5,
        horaPedida: 12,
        horaReal: 11,
        minutosReal: 30,
        metas: [80, 80, 80, 43],
        reales: [0, 0, 0, 0]
    };
}

function calcularDia(datos) {
    let tareas = parseFloat(datos.tareas) || 0;
    let horaPedida = parseInt(datos.horaPedida);
    let horaReal = parseInt(datos.horaReal);
    let minutosReal = parseInt(datos.minutosReal) || 0;
    let desayuno = parseFloat(datos.desayuno) || 0;
    let almuerzo = 0.5;
    
    let m1 = parseFloat(datos.metas[0]) || 0;
    let m2 = parseFloat(datos.metas[1]) || 0;
    let m3 = parseFloat(datos.metas[2]) || 0;
    let m4 = parseFloat(datos.metas[3]) || 0;
    
    let r1 = parseFloat(datos.reales[0]) || 0;
    let r2 = parseFloat(datos.reales[1]) || 0;
    let r3 = parseFloat(datos.reales[2]) || 0;
    let r4 = parseFloat(datos.reales[3]) || 0;
    
    let ma1 = m1, ma2 = m1 + m2, ma3 = m1 + m2 + m3, ma4 = m1 + m2 + m3 + m4;
    let ra4 = r1 + r2 + r3 + r4;
    
    let horasBase;
    if (horaPedida === 14) {
        horasBase = horaPedida - 6 - desayuno - almuerzo;
    } else {
        horasBase = horaPedida - 6 - desayuno;
    }
    horasBase = Math.max(0, horasBase);
    
    let horasReales;
    if (horaReal >= 12) {
        horasReales = horaReal - 6 - desayuno - almuerzo + minutosReal / 60;
    } else {
        horasReales = horaReal - 6 - desayuno + minutosReal / 60;
    }
    horasReales = Math.max(0, horasReales);
    
    let ritmoBase = horasBase > 0 ? tareas / horasBase : 0;
    let ritmoReal = horasReales > 0 ? ra4 / horasReales : 0;
    
    let productividad = ritmoBase > 0 ? (ritmoReal / ritmoBase) * 100 : 0;
    
    let rango = "", incentivo = 0;
    if (productividad >= 130) { rango = "130% o más"; incentivo = 3150; }
    else if (productividad >= 120) { rango = "120-129.99%"; incentivo = 3000; }
    else if (productividad >= 110) { rango = "110-119.99%"; incentivo = 2850; }
    else if (productividad >= 100) { rango = "100-109.99%"; incentivo = 2700; }
    else if (productividad >= 90) { rango = "90-99.99%"; incentivo = 2400; }
    else if (productividad >= 80) { rango = "80-89.99%"; incentivo = 2100; }
    else { rango = "<80%"; incentivo = 0; }
    
    return {
        productividad: productividad,
        rango: rango,
        incentivo: incentivo,
        realAcumulado: ra4,
        ritmoReal: ritmoReal,
        horasReales: horasReales
    };
}

function renderDia(dia, fecha, datos, index, isActive) {
    let resultado = calcularDia(datos);
    
    return `
        <div class="dia-semana ${isActive ? 'activo' : ''}" onclick="toggleDia(${index})">
            <div class="dia-titulo">
                <strong>${dia} ${fecha}</strong>
                <div class="dia-stats">
                    <span>📈 ${resultado.productividad.toFixed(1)}%</span>
                    <span>🎯 ${resultado.rango}</span>
                    <span>💰 C$${resultado.incentivo}</span>
                </div>
            </div>
            <div class="dia-contenido" id="contenido-${index}">
                <div class="input-group">
                    <div><label>📦 Tareas totales:</label><input type="number" class="tareas-${index}" value="${datos.tareas}"></div>
                    <div><label>🍽️ Desayuno (horas):</label><input type="number" class="desayuno-${index}" value="${datos.desayuno}" step="0.5"></div>
                    <div><label>⏰ Hora pedida:</label>
                        <select class="horaPedida-${index}">
                            <option value="10" ${datos.horaPedida == 10 ? 'selected' : ''}>10am</option>
                            <option value="11" ${datos.horaPedida == 11 ? 'selected' : ''}>11am</option>
                            <option value="12" ${datos.horaPedida == 12 ? 'selected' : ''}>12pm</option>
                            <option value="13" ${datos.horaPedida == 13 ? 'selected' : ''}>1pm</option>
                            <option value="14" ${datos.horaPedida == 14 ? 'selected' : ''}>2pm</option>
                        </select>
                    </div>
                    <div><label>⏱️ Hora real:</label>
                        <select class="horaReal-${index}">
                            <option value="8" ${datos.horaReal == 8 ? 'selected' : ''}>8am</option>
                            <option value="9" ${datos.horaReal == 9 ? 'selected' : ''}>9am</option>
                            <option value="10" ${datos.horaReal == 10 ? 'selected' : ''}>10am</option>
                            <option value="11" ${datos.horaReal == 11 ? 'selected' : ''}>11am</option>
                            <option value="12" ${datos.horaReal == 12 ? 'selected' : ''}>12pm</option>
                            <option value="13" ${datos.horaReal == 13 ? 'selected' : ''}>1pm</option>
                            <option value="14" ${datos.horaReal == 14 ? 'selected' : ''}>2pm</option>
                        </select>
                    </div>
                    <div><label>⏱️ Minutos reales:</label>
                        <select class="minutosReal-${index}">
                            <option value="0" ${datos.minutosReal == 0 ? 'selected' : ''}>00</option>
                            <option value="15" ${datos.minutosReal == 15 ? 'selected' : ''}>15</option>
                            <option value="30" ${datos.minutosReal == 30 ? 'selected' : ''}>30</option>
                            <option value="45" ${datos.minutosReal == 45 ? 'selected' : ''}>45</option>
                        </select>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>#</th><th>Hora</th><th>Meta</th><th>Real</th></tr></thead>
                        <tbody>
                            <tr><td>1</td><td>6-8</td><td><input type="number" class="m1-${index}" value="${datos.metas[0]}"></td><td><input type="number" class="r1-${index}" value="${datos.reales[0]}"></td></tr>
                            <tr><td>2</td><td>8-10</td><td><input type="number" class="m2-${index}" value="${datos.metas[1]}"></td><td><input type="number" class="r2-${index}" value="${datos.reales[1]}"></td></tr>
                            <tr><td>3</td><td>10-12</td><td><input type="number" class="m3-${index}" value="${datos.metas[2]}"></td><td><input type="number" class="r3-${index}" value="${datos.reales[2]}"></td></tr>
                            <tr><td>4</td><td>12-14</td><td><input type="number" class="m4-${index}" value="${datos.metas[3]}"></td><td><input type="number" class="r4-${index}" value="${datos.reales[3]}"></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="result-dia" id="resultado-${index}">
                    <p>⏳ Horas trabajadas: <span>${resultado.horasReales.toFixed(2)}h</span> | Ritmo: <span>${resultado.ritmoReal.toFixed(2)} t/h</span></p>
                    <p>📈 Productividad: <span>${resultado.productividad.toFixed(1)}%</span></p>
                    <p>🎯 Rango: <span>${resultado.rango}</span> | 💰 Incentivo: <span>C$${resultado.incentivo}</span></p>
                </div>
            </div>
        </div>
    `;
}

function actualizarResultadoDia(index) {
    let datos = obtenerDatosDelDia(index);
    let resultado = calcularDia(datos);
    let divResultado = document.getElementById(`resultado-${index}`);
    if (divResultado) {
        divResultado.innerHTML = `
            <p>⏳ Horas trabajadas: <span>${resultado.horasReales.toFixed(2)}h</span> | Ritmo: <span>${resultado.ritmoReal.toFixed(2)} t/h</span></p>
            <p>📈 Productividad: <span>${resultado.productividad.toFixed(1)}%</span></p>
            <p>🎯 Rango: <span>${resultado.rango}</span> | 💰 Incentivo: <span>C$${resultado.incentivo}</span></p>
        `;
    }
    
    // Actualizar el título del día
    let diaDiv = document.querySelector(`.dia-semana`).parentElement?.children[index];
    if (diaDiv) {
        let statsDiv = diaDiv.querySelector('.dia-stats');
        if (statsDiv) {
            statsDiv.innerHTML = `
                <span>📈 ${resultado.productividad.toFixed(1)}%</span>
                <span>🎯 ${resultado.rango}</span>
                <span>💰 C$${resultado.incentivo}</span>
            `;
        }
    }
    
    renderResumenSemanal();
}

function obtenerDatosDelDia(index) {
    return {
        tareas: document.querySelector(`.tareas-${index}`)?.value || 283,
        desayuno: document.querySelector(`.desayuno-${index}`)?.value || 0.5,
        horaPedida: document.querySelector(`.horaPedida-${index}`)?.value || 12,
        horaReal: document.querySelector(`.horaReal-${index}`)?.value || 11,
        minutosReal: document.querySelector(`.minutosReal-${index}`)?.value || 30,
        metas: [
            document.querySelector(`.m1-${index}`)?.value || 0,
            document.querySelector(`.m2-${index}`)?.value || 0,
            document.querySelector(`.m3-${index}`)?.value || 0,
            document.querySelector(`.m4-${index}`)?.value || 0
        ],
        reales: [
            document.querySelector(`.r1-${index}`)?.value || 0,
            document.querySelector(`.r2-${index}`)?.value || 0,
            document.querySelector(`.r3-${index}`)?.value || 0,
            document.querySelector(`.r4-${index}`)?.value || 0
        ]
    };
}

function guardarTodosLosDatos() {
    let fechas = obtenerFechasSemana();
    let semana = {};
    for (let i = 0; i < 6; i++) {
        semana[fechas[i]] = obtenerDatosDelDia(i);
    }
    return semana;
}

function cargarSemana() {
    let semanaKey = document.getElementById('semanaInicio').value;
    if (!semanaKey) {
        alert('❌ Seleccione una fecha de inicio de semana');
        return;
    }
    
    let todasSemanas = JSON.parse(localStorage.getItem('semanasNorlan') || '{}');
    let semana = todasSemanas[semanaKey];
    
    if (!semana) {
        alert('❌ No hay datos guardados para esta semana');
        return;
    }
    
    let fechas = obtenerFechasSemana();
    for (let i = 0; i < 6; i++) {
        let fecha = fechas[i];
        let datos = semana[fecha];
        if (datos) {
            if (document.querySelector(`.tareas-${i}`)) {
                document.querySelector(`.tareas-${i}`).value = datos.tareas;
                document.querySelector(`.desayuno-${i}`).value = datos.desayuno;
                document.querySelector(`.horaPedida-${i}`).value = datos.horaPedida;
                document.querySelector(`.horaReal-${i}`).value = datos.horaReal;
                document.querySelector(`.minutosReal-${i}`).value = datos.minutosReal;
                document.querySelector(`.m1-${i}`).value = datos.metas[0];
                document.querySelector(`.m2-${i}`).value = datos.metas[1];
                document.querySelector(`.m3-${i}`).value = datos.metas[2];
                document.querySelector(`.m4-${i}`).value = datos.metas[3];
                document.querySelector(`.r1-${i}`).value = datos.reales[0];
                document.querySelector(`.r2-${i}`).value = datos.reales[1];
                document.querySelector(`.r3-${i}`).value = datos.reales[2];
                document.querySelector(`.r4-${i}`).value = datos.reales[3];
                actualizarResultadoDia(i);
            }
        }
    }
    alert('✅ Semana cargada correctamente');
}

function guardarSemana() {
    let semanaKey = document.getElementById('semanaInicio').value;
    if (!semanaKey) {
        alert('❌ Seleccione una fecha de inicio de semana');
        return;
    }
    
    let semana = guardarTodosLosDatos();
    let todasSemanas = JSON.parse(localStorage.getItem('semanasNorlan') || '{}');
    todasSemanas[semanaKey] = semana;
    localStorage.setItem('semanasNorlan', JSON.stringify(todasSemanas));
    alert('✅ Semana guardada correctamente');
}

function nuevaSemana() {
    if (confirm('¿Crear nueva semana? Se perderán los datos no guardados.')) {
        let hoy = new Date();
        let inicioSemana = obtenerInicioSemana(hoy);
        document.getElementById('semanaInicio').value = formatearFecha(inicioSemana);
        renderizarSemana();
    }
}

function exportarSemana() {
    let todasSemanas = localStorage.getItem('semanasNorlan');
    if (!todasSemanas || todasSemanas === '{}') {
        alert('No hay datos para exportar');
        return;
    }
    
    let blob = new Blob([todasSemanas], {type: 'application/json'});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = `respaldo_semanas_norlan_${obtenerFechaActual()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    alert('✅ Datos exportados exitosamente');
}

function importarSemana() {
    let input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = function(e) {
        let file = e.target.files[0];
        let reader = new FileReader();
        reader.onload = function(evt) {
            try {
                let datos = JSON.parse(evt.target.result);
                localStorage.setItem('semanasNorlan', JSON.stringify(datos));
                alert('✅ Datos importados exitosamente');
                renderizarSemana();
            } catch(err) {
                alert('❌ Error al importar: archivo inválido');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

function renderResumenSemanal() {
    let semana = guardarTodosLosDatos();
    let fechas = obtenerFechasSemana();
    let resultados = [];
    let totalIncentivo = 0;
    
    for (let i = 0; i < 6; i++) {
        let resultado = calcularDia(semana[fechas[i]]);
        resultados.push({
            dia: DIAS[i],
            fecha: fechas[i],
            productividad: resultado.productividad,
            rango: resultado.rango,
            incentivo: resultado.incentivo,
            realAcumulado: resultado.realAcumulado
        });
        totalIncentivo += resultado.incentivo;
    }
    
    let html = `
        <h3>📊 RESUMEN SEMANAL</h3>
        <table style="width:100%">
            <thead>
                <tr><th>Día</th><th>Fecha</th><th>Producción Real</th><th>Productividad</th><th>Rango</th><th>Incentivo</th></tr>
            </thead>
            <tbody>
    `;
    
    resultados.forEach(r => {
        html += `
            <tr>
                <td><strong>${r.dia}</strong></td>
                <td>${r.fecha}</td>
                <td>${r.realAcumulado} tareas</td>
                <td>${r.productividad.toFixed(1)}%</td>
                <td>${r.rango}</td>
                <td><strong>C$${r.incentivo}</strong></td>
            </tr>
        `;
    });
    
    html += `
            </tbody>
        </table>
        <div class="total-semanal">
            💰 INCENTIVO TOTAL DE LA SEMANA: C$${totalIncentivo}
        </div>
    `;
    
    document.getElementById('resumenSemanal').innerHTML = html;
}

function renderizarSemana() {
    let fechas = obtenerFechasSemana();
    let semanaGuardada = JSON.parse(localStorage.getItem('semanasNorlan') || '{}');
    let semanaActual = semanaGuardada[document.getElementById('semanaInicio').value] || {};
    
    let html = '';
    for (let i = 0; i < 6; i++) {
        let fecha = fechas[i];
        let datos = semanaActual[fecha] || obtenerDatosPorDefecto();
        html += renderDia(DIAS[i], fecha, datos, i, i === 0);
    }
    
    document.getElementById('diasContainer').innerHTML = html;
    
    // Agregar event listeners
    for (let i = 0; i < 6; i++) {
        let inputs = document.querySelectorAll(`[class*="-${i}"]`);
        inputs.forEach(input => {
            input.addEventListener('input', () => actualizarResultadoDia(i));
            input.addEventListener('change', () => actualizarResultadoDia(i));
        });
    }
    
    renderResumenSemanal();
}

function toggleDia(index) {
    let contenidos = document.querySelectorAll('.dia-contenido');
    let dias = document.querySelectorAll('.dia-semana');
    contenidos.forEach(c => c.classList.remove('activo'));
    dias.forEach(d => d.classList.remove('activo'));
    document.getElementById(`contenido-${index}`).classList.add('activo');
    dias[index].classList.add('activo');
}

// Inicializar
let hoy = new Date();
let inicioSemana = obtenerInicioSemana(hoy);
document.getElementById('semanaInicio').value = formatearFecha(inicioSemana);
renderizarSemana();
</script>
